name: 하드웨어 앱 빌드

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hardware-app/**'
      - '.github/workflows/build-hw-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Android SDK 36 · NDK 27 · CMake 설치
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "platform-tools" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: APK 빌드
        env:
          ENTRY_KEYSTORE_BASE64: ${{ secrets.ENTRY_KEYSTORE_BASE64 }}
          ENTRY_KEYSTORE_PASSWORD: ${{ secrets.ENTRY_KEYSTORE_PASSWORD }}
          ENTRY_HW_NDK_VERSION: 27.2.12479018
        run: bash hardware-app/build-hw.sh

      - uses: actions/upload-artifact@v7
        with:
          name: EntryAndroidHardware-apk
          path: out/EntryAndroidHardware.apk
          compression-level: 0
          retention-days: 30

      - name: 릴리스(hardware-latest)에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(grep -o 'versionName "[^"]*"' hardware-app/android/app/build.gradle | cut -d'"' -f2)"
          if ! gh release view hardware-latest > /dev/null 2>&1; then
            gh release create hardware-latest --title "Entry Android Hardware" \
              --notes "엔트리 하드웨어 연결 프로그램 (안드로이드). Entry for Android 의 [연결 프로그램 다운로드]가 이 파일을 받습니다." \
              --latest=false
          fi
          gh release upload hardware-latest out/EntryAndroidHardware.apk --clobber
          gh release edit hardware-latest --title "Entry Android Hardware ${VERSION}"
