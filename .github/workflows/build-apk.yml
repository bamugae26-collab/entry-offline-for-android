name: APK 빌드

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'entry-local.patch'
      - 'build-android.sh'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: 디스크 공간 확보
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK 36 설치
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "platform-tools"

      - name: APK 빌드
        env:
          ENTRY_KEYSTORE_BASE64: ${{ secrets.ENTRY_KEYSTORE_BASE64 }}
          ENTRY_KEYSTORE_PASSWORD: ${{ secrets.ENTRY_KEYSTORE_PASSWORD }}
        run: bash build-android.sh

      - uses: actions/upload-artifact@v7
        with:
          name: EntryLocal-apk
          path: out/*.apk
          compression-level: 0
          retention-days: 30
